[project]
name = "wopr-proyectos"
version = "0.1.0"
description = "Planificador de proyectos local: árbol de tareas, dependencias y timeline calculado"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.121.2",
    "uvicorn==0.41.0",
    "sqlmodel==0.0.27",
    "jinja2==3.1.6",
    "python-multipart==0.0.20",
    "openpyxl==3.1.5",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
