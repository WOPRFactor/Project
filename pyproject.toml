[project]
name = "wopr-proyectos"
version = "0.1.0"
description = "Planificador de proyectos local: árbol de tareas, dependencias y timeline calculado"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.121.2",
    "uvicorn==0.41.0",
    "sqlmodel==0.0.27",
    "jinja2==3.1.6",
    "python-multipart==0.0.20",
    "openpyxl==3.1.5",
    # El asistente (Fase 29) llama a Groq; también lo usa el TestClient de dev.
    "httpx==0.28.1",
    # Multiusuario (bloque A): migraciones versionadas y hash de contraseñas.
    "alembic==1.18.5",
    "argon2-cffi==25.1.0",
    # Export a Word (Fase 30). El PDF no necesita nada: lo imprime el Chrome del sistema.
    "python-docx==1.2.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]
# Tests de navegador (tests/navegador/), opcionales: `uv sync --group navegador`.
# Usan el Chrome del sistema; sin este grupo, pytest saltea la carpeta.
navegador = [
    "playwright==1.61.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
